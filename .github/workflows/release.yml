name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Verify
        run: |
          go vet ./...
          go test ./... -race
      # Go modules are published implicitly via the module proxy — there is
      # no registry token to configure. Nudging proxy.golang.org makes the
      # new version resolvable immediately; the GitHub release documents it.
      - name: Warm module proxy
        run: |
          GOPROXY=proxy.golang.org go list -m \
            "github.com/camelmailer/camelmailer-go@${GITHUB_REF_NAME}" || true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
